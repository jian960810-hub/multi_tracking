name: ROS 2 Jazzy
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    container: ros:jazzy-ros-base
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install test and runtime dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3-numpy python3-scipy python3-pytest python3-yaml ros-jazzy-ament-cmake-pytest ros-jazzy-rviz2
      - name: Build and test against real Jazzy
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --packages-select multi_tracking --cmake-args -DPython3_EXECUTABLE=/usr/bin/python3
          source install/setup.bash
          python3 -c 'import rclpy, sensor_msgs, visualization_msgs, launch_ros'
          ros2 pkg executables multi_tracking
          ros2 launch multi_tracking hello.launch.py --show-args
          colcon test --packages-select multi_tracking --event-handlers console_direct+
          colcon test-result --verbose
